apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: fastapi-service
  title: FastAPI Service
  description: Scaffold a new FastAPI microservice as its own GitHub repo, auto-registered into ArgoCD and the Backstage catalog.
  tags:
    - recommended
    - python
    - fastapi
spec:
  owner: guests
  type: service

  parameters:
    - title: Service Information
      required:
        - serviceName
        - description
        - owner
      properties:
        serviceName:
          title: Service Name
          type: string
          description: Unique name for the new service (lowercase, hyphens only)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Owner
          type: string
          description: Backstage owner (e.g. guests, a team name)
          default: guests
        port:
          title: Port
          type: integer
          description: Port the service listens on
          default: 8000

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - SiliasOdion809

  steps:
    - id: fetch-service
      name: Fetch Service Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        values:
          serviceName: ${{ parameters.serviceName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}

    - id: fetch-gitops
      name: Fetch GitOps Manifests
      action: fetch:template
      input:
        url: ./gitops-skeleton
        targetPath: ./gitops
        values:
          serviceName: ${{ parameters.serviceName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          port: ${{ parameters.port }}

    - id: publish-repo
      name: Create Service Repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        sourcePath: ./service

    - id: publish-gitops-pr
      name: Open GitOps Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=SiliasOdion809&repo=Project-Forge
        branchName: add-${{ parameters.serviceName }}-service
        title: 'feat: onboard ${{ parameters.serviceName }} service via golden path'
        description: |
          Automatically generated by the `fastapi-service` Backstage golden-path
          template. Adds Kustomize manifests and an ArgoCD ApplicationSet for
          `${{ parameters.serviceName }}` under `live/addons/apps/`.

          This PR is expected to be auto-merged by the
          `auto-merge-golden-path-prs` workflow.
        sourcePath: ./gitops

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-repo'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Service Repository
        url: ${{ steps['publish-repo'].output.remoteUrl }}
      - title: GitOps Pull Request
        url: ${{ steps['publish-gitops-pr'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}